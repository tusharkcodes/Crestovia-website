<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0A3478" />
    <meta name="author" content="Crestovia" />
    <meta name="robots" content="index, follow" />

    <!-- Default SEO (overridden per-route by react-helmet-async) -->
    <title>Crestovia | Digital Marketing & AI Automation Agency, Pune</title>
    <meta
      name="description"
      content="Crestovia helps businesses grow through Website Development, SEO, Google Ads, Meta Ads, Branding, AI Automation, CRM Automation, Social Media Marketing and Performance Marketing."
    />
    <link rel="canonical" href="https://crestovia.in/" />

    <!-- Favicons (v2 filenames bust Google/browser cache of the old logo) -->
    <link rel="icon" href="/favicon-v2.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/favicon-v2.png" type="image/png" sizes="192x192" />
    <link rel="shortcut icon" href="/favicon-v2.png" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-v2.png" sizes="180x180" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Open Graph defaults -->
    <meta property="og:site_name" content="Crestovia" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://crestovia.in/" />
    <meta property="og:title" content="Crestovia | Digital Marketing & AI Automation Agency, Pune" />
    <meta
      property="og:description"
      content="Digital marketing agency in Pune for websites, SEO, ads, branding, and AI automation."
    />
    <meta property="og:image" content="https://crestovia.in/og-image-v2.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Crestovia | Digital Marketing & AI Automation Agency, Pune" />
    <meta name="twitter:image" content="https://crestovia.in/og-image-v2.png" />

    <!--
      Tracking IDs (optional — prefer Vite env in Analytics.jsx):
      VITE_GA4_MEASUREMENT_ID / VITE_GTM_ID / VITE_CLARITY_ID / VITE_META_PIXEL_ID / VITE_GSC_VERIFICATION
    -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
