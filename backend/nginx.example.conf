# =============================================================================
# Crestovia — Nginx reverse proxy for Hostinger / Ubuntu
# Frontend: https://crestovia.in
# Backend:  https://crestovia.in/api/  →  FastAPI on 127.0.0.1:8000
#
# Adjust SSL certificate paths for your Hostinger / Certbot setup.
# =============================================================================

# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name crestovia.in www.crestovia.in;

    # ACME challenge (Let's Encrypt / Certbot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — primary site
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name crestovia.in www.crestovia.in;

    # --- SSL (Certbot paths — update if Hostinger uses different locations) ---
    ssl_certificate     /etc/letsencrypt/live/crestovia.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crestovia.in/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Frontend build (Vite dist)
    root /var/www/crestovia/dist;
    index index.html;

    # Large uploads (contact form / future media)
    client_max_body_size 25m;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # --- FastAPI backend under /api/ ---
    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_request_headers on;

        # Timeouts for slower Atlas / cold starts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Do not buffer large responses unnecessarily
        proxy_buffering off;
    }

    # Health check (direct, not under /api/)
    location = /health {
        proxy_pass http://127.0.0.1:8000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA routes (including hidden /admin/* pages)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static hashed assets from Vite
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
